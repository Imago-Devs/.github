name: Min Reusable
on:
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        required: true
    inputs:
      models:
        type: string
        default: "poolside/laguna-s-2.1:free,meta-llama/llama-3.1-8b-instruct:free"
        required: false

jobs:
  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "hello, model=${{ inputs.models }}, secret set=${{ secrets.OPENROUTER_API_KEY != '' }}"
